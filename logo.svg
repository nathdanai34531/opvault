<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
    <!-- Background -->
    <rect width="500" height="200" fill="#111827" />
    
    <g transform="translate(31, 0)">
        
        <!-- 1. Letter P (No Gap) -->
        <g fill="#ffffff">
            <!-- P Stem -->
            <rect x="150" y="40" width="40" height="120" />
            <!-- P Loop Outer -->
            <path d="M 190 40 L 235 40 C 280 40, 280 115, 235 115 L 190 115 Z" />
        </g>
        <!-- P Inner Hole (Knockout) -->
        <path d="M 190 68 L 215 68 C 235 68, 235 87, 215 87 L 190 87 Z" fill="#111827" />

        <!-- 2. Letter V (Cyan) - Drawn over P to create the perfect angled overlap -->
        <polygon points="255,40 295,40 335,120 375,40 415,40 355,160 315,160" fill="#38bdf8" />

        <!-- 3. Letter O (White) - Perfectly Round, no knockout border on P -->
        <circle cx="90" cy="100" r="62" fill="#ffffff" />
        
        <!-- 4. Anchor (Dark) - Negative space inside O (Classic smooth shape) -->
        <g fill="#111827">
            <!-- Top Ring -->
            <circle cx="90" cy="55" r="10" stroke="#111827" stroke-width="6" fill="none" />
            <!-- Stem -->
            <rect x="85" y="65" width="10" height="60" />
            <!-- Crossbar -->
            <rect x="60" y="75" width="60" height="10" rx="3" />
            <!-- Anchor Hook (Smooth crescent) -->
            <path d="M 50 115 C 50 150, 130 150, 130 115" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" />
            <!-- Left Fluke (Triangle pointing up) -->
            <polygon points="38,118 62,118 50,95" />
            <!-- Right Fluke (Triangle pointing up) -->
            <polygon points="118,118 142,118 130,95" />
        </g>
        
    </g>
</svg>
