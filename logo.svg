<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
    <!-- Background -->
    <rect width="500" height="200" fill="#111827" />
    
    <g transform="translate(42, 0)">
        <!-- Letter O -->
        <circle cx="100" cy="100" r="65" fill="#ffffff" />
        
        <!-- Negative Space Anchor inside O -->
        <g fill="#111827" stroke="#111827">
            <!-- Top Ring -->
            <circle cx="100" cy="62" r="10" fill="none" stroke-width="6" />
            <!-- Stem -->
            <rect x="95" y="72" width="10" height="65" stroke="none" />
            <!-- Crossbar -->
            <rect x="70" y="82" width="60" height="10" rx="3" stroke="none" />
            <!-- Bottom Hook -->
            <path d="M 55 105 C 55 150, 145 150, 145 105" fill="none" stroke-width="12" stroke-linecap="round" />
            <!-- Left Fluke (Triangle) -->
            <polygon points="43,108 67,108 55,85" stroke="none" />
            <!-- Right Fluke (Triangle) -->
            <polygon points="133,108 157,108 145,85" stroke="none" />
        </g>

        <!-- Letter P -->
        <path d="M 180 35 L 240 35 C 280 35, 280 115, 240 115 L 215 115 L 215 165 L 180 165 Z" fill="#ffffff" />
        <!-- P Inner Hole -->
        <path d="M 215 65 L 235 65 C 245 65, 245 85, 235 85 L 215 85 Z" fill="#111827" />

        <!-- Letter V (Cyan) - Ligature / Merged into P -->
        <!-- Shifted left to touch/intersect the P curve -->
        <polygon points="240,35 277,35 310,115 343,35 380,35 328,165 292,165" fill="#06b6d4" />
    </g>
</svg>
