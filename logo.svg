<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
    <!-- Background -->
    <rect width="500" height="200" fill="#111827" />
    
    <g transform="translate(31, 0)">
        
        <!-- 1. Letter P (Drawn first so V and O can overlap it) -->
        <g fill="#ffffff">
            <!-- P Stem -->
            <rect x="150" y="40" width="40" height="120" />
            <!-- P Loop Outer -->
            <path d="M 190 40 L 235 40 C 280 40, 280 115, 235 115 L 190 115 Z" />
        </g>
        <!-- P Inner Hole (Knockout) -->
        <path d="M 190 68 L 215 68 C 235 68, 235 87, 215 87 L 190 87 Z" fill="#111827" />

        <!-- 2. Letter V (Cyan) - Drawn over P to create the perfect angled overlap -->
        <polygon points="255,40 295,40 335,120 375,40 415,40 355,160 315,160" fill="#38bdf8" />

        <!-- 3. Letter O Knockout Border - Creates the crescent cutout on P -->
        <circle cx="90" cy="100" r="70" fill="#111827" />

        <!-- 4. Letter O (White) - Perfectly Round -->
        <circle cx="90" cy="100" r="62" fill="#ffffff" />
        
        <!-- 5. Anchor (Dark) - Negative space inside O -->
        <g fill="#111827">
            <!-- Top Ring -->
            <circle cx="90" cy="53" r="12" />
            <!-- Top Ring Hole -->
            <circle cx="90" cy="53" r="5" fill="#ffffff" />
            <!-- Stem -->
            <rect x="85" y="55" width="10" height="60" />
            <!-- Crossbar -->
            <rect x="65" y="68" width="50" height="9" rx="2" />
            <!-- Anchor Hook with Sharp Flukes and Pointed Bottom -->
            <path d="M 45 105 
                     L 52 87 
                     L 60 100 
                     C 60 125, 75 130, 90 135 
                     C 105 130, 120 125, 120 100 
                     L 128 87 
                     L 135 105 
                     C 135 145, 110 155, 90 160 
                     C 70 155, 45 145, 45 105 Z" />
        </g>
        
    </g>
</svg>
