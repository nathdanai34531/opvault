<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
    <!-- Background -->
    <rect width="500" height="200" fill="#111827" />
    
    <g transform="translate(36, 19)">
        <!-- Letter O (Golden Ratio Outer Diameter = 161.8) -->
        <circle cx="80.9" cy="80.9" r="80.9" fill="#ffffff" />
        
        <!-- Negative Space Anchor (Fat and Bold) -->
        <g fill="#111827" stroke="none">
            <!-- Ring -->
            <circle cx="80.9" cy="45.5" r="23.6" />
            <!-- Stem -->
            <rect x="69.1" y="45.5" width="23.6" height="74.5" />
            <!-- Crossbar -->
            <rect x="38.2" y="55" width="85.4" height="23.6" rx="6" />
            <!-- Hook -->
            <path d="M 30.9 100 A 50 50 0 0 0 130.9 100 L 104.5 100 A 26.4 26.4 0 0 1 57.3 100 Z" />
            <!-- Left Fluke -->
            <polygon points="11.8,100 50,100 30.9,70" />
            <!-- Right Fluke -->
            <polygon points="111.8,100 150,100 130.9,70" />
        </g>
        <!-- Ring inner hole -->
        <circle cx="80.9" cy="45.5" r="10" fill="#ffffff" />

        <!-- Letter P (Golden Ratio Proportions) -->
        <!-- Stem width 38.2, Outer arc radius 50 -->
        <path d="M 185.4 0 L 235.4 0 A 50 50 0 0 1 235.4 100 L 223.6 100 L 223.6 161.8 L 185.4 161.8 Z" fill="#ffffff" />
        <!-- P Inner Hole -->
        <path d="M 223.6 38.2 L 235.4 38.2 A 11.8 11.8 0 0 1 235.4 61.8 L 223.6 61.8 Z" fill="#111827" />

        <!-- Letter V (Cyan, shifted to touch P exactly at its peak) -->
        <polygon points="266.3,0 309.0,0 347.2,100 385.4,0 428.1,0 366.3,161.8 328.1,161.8" fill="#06b6d4" />
    </g>
</svg>
